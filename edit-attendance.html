<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        /* ===== DASHBOARD (FIXED WIDTH) ===== */
        .dashboard {
            max-width: 780px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* ===== TITLE ===== */
        h1 {
            margin-bottom: 18px;
            font-size: 26px;
            font-weight: 600;

            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;

            text-shadow: 0 0 8px rgba(139, 92, 246, 0.25);
        }

        /* ===== CARD (GRID STYLE) ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 16px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 20px;
            font-size: 13px;
            opacity: 0.9;
        }

        /* ===== CONTROLS ===== */
        .attendance-controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 14px;
        }

        .attendance-controls label {
            font-size: 12px;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .attendance-controls input,
        .attendance-controls select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* ===== BUTTON BASE ===== */
        button {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* ===== LOAD BUTTON ===== */
        .attendance-controls button {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 13px;
            transition: 0.25s;
        }

        .attendance-controls button:hover {
            transform: scale(1.05);
        }

        /* ===== BULK BUTTONS ===== */
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .bulk-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            border: none;
            color: white;
        }

        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .bulk-actions button:hover {
            transform: scale(1.05);
        }

        /* ===== TABLE ===== */
        /* ===== TABLE (PREMIUM BORDER UPGRADE) ===== */
        table {
            width: 100%;
            border-collapse: separate;
            /* 🔥 IMPORTANT */
            border-spacing: 0;
            font-size: 13px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
        }

        /* HEADER */
        thead th {
            text-align: left;
            padding: 12px 10px;
            opacity: 0.7;

            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* ROW */
        tbody tr {
            transition: 0.2s;
        }

        /* HOVER */
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* CELLS */
        tbody td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* REMOVE LAST ROW BORDER */
        tbody tr:last-child td {
            border-bottom: none;
        }

        /* COLUMN LINES */
        td:not(:last-child),
        th:not(:last-child) {
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ALIGNMENT */
        td:nth-child(3),
        td:nth-child(4) {
            text-align: center;
        }

        /* ===== ROW COLORS ===== */
        tr.present-row {
            background: rgba(34, 197, 94, 0.08);
        }

        tr.absent-row {
            background: rgba(239, 68, 68, 0.08);
        }

        /* ===== STATUS BUTTON ===== */
        .status-btn {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            border: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .status-btn.present.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
        }

        .status-btn.absent.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
        }

        /* ===== TEXTAREA ===== */
        .reasonBox {
            width: 100%;
            padding: 6px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* ===== UPDATE BUTTON ===== */
        .update-btn {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-size: 14px;
            font-weight: 600;

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);

            transition: 0.25s;
        }

        .update-btn:hover {
            transform: translateY(-2px);
        }

        /* ===== SPINNER ===== */
        button.loading {
            pointer-events: none;
            color: transparent !important;
        }

        button.loading::after {
            content: "";
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        button:active {
            transform: scale(0.96);
        }

        select option {
            color: black;
        }
    </style>


</head>

<body>


    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="attendance-controls">

            <div>
                <label>📅 Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div>
                <label>⏰ Class Time</label>
                <select id="timeSelect">
                    <option>Select date first</option>
                </select>
            </div>

            <div>
                <button onclick="loadAttendance()">Load</button>
            </div>

        </div>

        <div class="bulk-actions">
            <button onclick="markAll(true, event)">Mark All Present</button>
            <button onclick="markAll(false, event)">Mark All Absent</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>USN</th>
                    <th>Name</th>
                    <th>%</th>
                    <th>Status</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody id="studentRows"></tbody>
        </table>

        <button class="update-btn" onclick="updateAttendance()">
            Update Attendance
        </button>

    </div>

    <script src="mockData.js"></script>
    <script src="utils.js"></script>
    <script src="edit.js"></script>

</body>

</html>
