<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        /* ===== DASHBOARD (FIX WIDTH FIXED) ===== */
        .dashboard {
            max-width: 880px;
            /* 🔥 reduced width */
            margin: 30px auto;
            padding: 22px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* ===== TITLE ===== */
        h1 {
            margin-bottom: 18px;
            font-size: 26px;
            font-weight: 600;

            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 🔥 IMPORTANT */

            background-clip: text;
            /* fallback */
            color: transparent;
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 18px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
        }

        /* ===== CONTROLS (FIXED) ===== */
        .attendance-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 110px;
            /* 🔥 fixed button */
            gap: 14px;
            align-items: end;
            margin-bottom: 18px;
        }

        .attendance-controls label {
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        /* ===== INPUTS FIX ===== */
        .attendance-controls input,
        .attendance-controls select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* ===== LOAD BUTTON FIX ===== */
        .attendance-controls button {
            height: 40px;
            width: 100%;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transition: 0.25s;
        }

        .attendance-controls button:hover {
            transform: scale(1.05);
        }

        /* ===== BULK BUTTONS ===== */
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .bulk-actions button {
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            border: none;
            color: white;
            min-width: 150px;
        }

        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
        }

        thead th {
            padding: 12px;
            opacity: 0.7;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        tbody td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== STATUS ===== */
        .status-btn {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            border: none;
        }

        .status-btn.present.active {
            background: #22c55e;
        }

        .status-btn.absent.active {
            background: #ef4444;
        }

        /* ===== UPDATE BUTTON (FIXED) ===== */
        .update-btn {
            display: block;
            margin: 22px auto 0;
            /* 🔥 center */
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;

            min-width: 240px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        /* ===== ERROR ===== */
        .input-group {
            position: relative;
        }

        .field-error {
            position: absolute;
            top: -20px;
            right: 5px;
            font-size: 11px;
            color: #ef4444;
        }

        .input-error {
            border: 1px solid #ef4444 !important;
        }

        /* ===== SHAKE ===== */
        .shake {
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-4px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>


</head>

<body>


    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="attendance-controls">

            <div class="input-group">
                <label>📅 Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div class="input-group">
                <label>⏰ Class Time</label>
                <select id="timeSelect">
                    <option value="">Select date first</option>
                </select>
            </div>

            <div>
                <button onclick="loadAttendance(event)">Load</button>
            </div>

        </div>

        <div class="bulk-actions">
            <button onclick="markAll(true, event)">Mark All Present</button>
            <button onclick="markAll(false, event)">Mark All Absent</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>USN</th>
                    <th>Name</th>
                    <th>%</th>
                    <th>Status</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody id="studentRows"></tbody>
        </table>

        <button class="update-btn" onclick="updateAttendance()">
            Update Attendance
        </button>

    </div>

    <script src="mockData.js"></script>
    <script src="utils.js"></script>
    <script src="edit.js"></script>

</body>

</html>
