<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        /* ===== REMOVE DEFAULT TABLE LOOK ===== */
        table {
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        thead th {
            opacity: 0.7;
            font-weight: 500;
        }

        tbody tr {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            transition: 0.25s ease;
        }

        tbody tr:hover {
            transform: scale(1.01);
            background: rgba(255, 255, 255, 0.08);
        }

        tbody td {
            padding: 14px 12px;
            border: none;
        }

        /* ===== REMOVE OLD BORDER LEFT ===== */
        tbody tr td:first-child {
            border-left: none !important;
        }

        /* ===== PRESENT / ABSENT ROW ===== */
        tr.present-row {
            background: rgba(34, 197, 94, 0.12);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
        }

        tr.absent-row {
            background: rgba(239, 68, 68, 0.12);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
        }

        /* ===== STATUS BUTTON (MAIN FIX 🔥) ===== */
        .status-btn {
            padding: 7px 16px;
            border-radius: 12px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.25s;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        /* GLOW ACTIVE */
        .status-btn.present.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow:
                0 0 10px rgba(34, 197, 94, 0.7),
                inset 0 0 6px rgba(255, 255, 255, 0.2);
        }

        .status-btn.absent.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow:
                0 0 10px rgba(239, 68, 68, 0.7),
                inset 0 0 6px rgba(255, 255, 255, 0.2);
        }

        .status-btn:hover {
            transform: scale(1.08);
        }

        /* ===== BULK BUTTONS FIX ===== */
        .bulk-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        /* GREEN */
        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }

        /* RED */
        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .bulk-actions button:hover {
            transform: scale(1.05);
        }

        /* ===== DROPDOWN FIX (IMPORTANT) ===== */
        select option {
            color: black;
            /* fixes white text issue */
        }

        /* ===== INPUT CLEAN ===== */
        input,
        select {
            outline: none;
        }

        /* ===== UPDATE BUTTON PREMIUM ===== */
        .update-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-size: 15px;
            transition: 0.25s;
        }

        .update-btn:hover {
            transform: translateY(-2px) scale(1.02);
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="attendance-controls">

            <div>
                <label>📅 Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div>
                <label>⏰ Class Time</label>
                <select id="timeSelect">
                    <option>Select date first</option>
                </select>
            </div>

            <div>
                <button onclick="loadAttendance()">Load</button>
            </div>

        </div>

        <div class="bulk-actions">
            <button onclick="markAllEdit('Present')">All Present</button>
            <button onclick="markAllEdit('Absent')">All Absent</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>USN</th>
                    <th>Name</th>
                    <th>%</th>
                    <th>Status</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody id="studentRows"></tbody>
        </table>

        <div class="update-btn-container">
            <button class="update-btn" onclick="updateAttendance()">
                Update Attendance
            </button>
        </div>

    </div>

    <script src="mockData.js"></script>
    <script src="utils.js"></script>
    <script src="edit.js"></script>

</body>

</html>
