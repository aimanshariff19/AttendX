<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AttendX / Take Attendance</title>

    <link rel="icon" href="assets/logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        .dashboard {
            max-width: 950px;
            margin: 40px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 100%;
            left: 0;
            top: 0;
            background: rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .btn:hover::after {
            width: 100%;
        }

        .back-btn {
            align-self: flex-start;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }

        .input-group input {
            margin-top: 4px;
            padding: 9px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
        }

        tbody tr {
            transition: 0.25s;
            border-radius: 12px;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
        }

        /* 🔥 STATUS BUTTON */
        .status-btn {
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            color: white;
            transition: 0.25s;
        }

        .status-btn.present {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .status-btn.absent {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .status-btn:hover {
            transform: scale(1.08);
        }

        /* 🔥 ROW COLORS */
        tr.present-row {
            background: rgba(34, 197, 94, 0.12);
            border-left: 4px solid #22c55e;
        }

        tr.absent-row {
            background: rgba(239, 68, 68, 0.12);
            border-left: 4px solid #ef4444;
        }

        /* 🔥 UPDATE BUTTON */
        .update-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 15px;
            border-radius: 14px;
        }

        /* 🔥 SPINNER */
        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header">

            <div class="header-top">
                <h1>AttendX / Take Attendance</h1>
                <button class="btn" onclick="editAttendance(this)">Edit Attendance</button>
            </div>

            <button class="btn back-btn" onclick="goBack(event)">← Back</button>

        </div>

        <div class="card">
            <p><b>Course:</b> <span id="subject"></span></p>
            <p><b>Department:</b> <span id="department"></span></p>
            <p><b>Program:</b> <span id="program"></span></p>
            <p><b>Semester:</b> <span id="sem"></span></p>
            <p><b>Section:</b> <span id="section"></span></p>
        </div>

        <div class="card">
            <div class="input-grid">
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="date">
                </div>

                <div class="input-group">
                    <label>Start Time</label>
                    <input type="time" id="classTime">
                </div>

                <div class="input-group">
                    <label>No. of Classes</label>
                    <input type="number" id="numClasses" value="1">
                </div>

                <div class="input-group">
                    <label>Current Time</label>
                    <input type="text" id="currentTime" readonly>
                </div>
            </div>

            <p><b>Class Time :</b> <span id="timeRange">--</span></p>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn" onclick="markAll(true)">All Present</button>
            <button class="btn" onclick="markAll(false)">All Absent</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>%</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="studentRows"></tbody>
            </table>
        </div>

        <button id="submitBtn" class="btn update-btn" onclick="submitAttendance(this)">
            Submit Attendance
        </button>

    </div>

    <script src="mockData.js"></script>
    <script src="attendance.js"></script>

</body>

</html>
