<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e5e7eb;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
        }

        /* ===== TITLE ===== */
        h1 {
            font-size: 22px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        /* ===== CONTROLS ===== */
        .attendance-controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
        }

        .attendance-controls label {
            font-size: 12px;
            margin-bottom: 4px;
            display: block;
            color: #9ca3af;
        }

        .attendance-controls input,
        .attendance-controls select {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        /* ===== BUTTON BASE ===== */
        button {
            position: relative;
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.4);
        }

        /* ===== 🔥 BUTTON SPINNER ===== */
        button.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        button.loading::after {
            content: "";
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            position: absolute;
            animation: spin 0.6s linear infinite;
        }

        /* ===== BULK BUTTONS ===== */
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            margin-bottom: 18px;
        }

        thead th {
            text-align: left;
            padding: 10px;
            font-size: 13px;
            color: #9ca3af;
        }

        tbody tr {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: 0.2s;
        }

        tbody td {
            padding: 12px 10px;
        }

        tbody tr td:first-child {
            border-left: 4px solid #6366f1;
            border-radius: 10px 0 0 10px;
        }

        tbody tr td:last-child {
            border-radius: 0 10px 10px 0;
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        /* ===== UPDATE BUTTON ===== */
        .update-btn-container {
            margin-top: 10px;
        }

        .update-btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        /* ===== ANIMATION ===== */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>


</head>

<body>

    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <!-- CONTROLS -->
        <div class="attendance-controls">

            <div>
                <label>📅 Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div>
                <label>⏰ Class Time</label>
                <select id="timeSelect">
                    <option>Select date first</option>
                </select>
            </div>

            <div>
                <button onclick="loadAttendance()">Load</button>
            </div>

        </div>

        <!-- BULK -->
        <div class="bulk-actions">
            <button onclick="markAllEdit('Present')">All Present</button>
            <button onclick="markAllEdit('Absent')">All Absent</button>
        </div>

        <!-- TABLE -->
        <table>
            <thead>
                <tr>
                    <th>USN</th>
                    <th>Name</th>
                    <th>%</th>
                    <th>Status</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody id="studentRows"></tbody>
        </table>

        <!-- UPDATE -->
        <div class="update-btn-container">
            <button class="update-btn" onclick="updateAttendance()">
                Update Attendance
            </button>
        </div>

    </div>

    <script src="mockData.js"></script>
    <script src="utils.js"></script>
    <script src="edit.js"></script>

</body>

</html>
