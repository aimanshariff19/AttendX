<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AttendX / Take Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        .dashboard {
            max-width: 950px;
            margin: 40px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        tbody tr {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        tbody td {
            padding: 14px;
        }

        /* 🔥 PROGRESS */
        .bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 6px;
        }

        .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        .low-bar .fill {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        .percent-text {
            font-weight: 600;
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 18px;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 20px;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 2px;
            top: 2px;
            background: white;
            border-radius: 50%;
            transition: .3s;
        }

        input:checked+.slider {
            background: #22c55e;
        }

        input:checked+.slider::before {
            transform: translateX(18px);
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h2>AttendX / Take Attendance</h2>
            <button class="btn" onclick="goBack()">← Back</button>
        </div>

        <div class="card">
            <p><b>Course:</b> <span id="subject"></span></p>
            <p><b>Department:</b> <span id="department"></span></p>
            <p><b>Program:</b> <span id="program"></span></p>
            <p><b>Semester:</b> <span id="sem"></span></p>
            <p><b>Section:</b> <span id="section"></span></p>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>Attendance</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="studentRows"></tbody>
            </table>
        </div>

        <button class="btn" onclick="submitAttendance()">Submit Attendance</button>

    </div>

    <script src="mockData.js"></script>
    <script src="attendance.js"></script>

</body>

</html>
