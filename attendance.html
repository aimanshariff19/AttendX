<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AttendX / Take Attendance</title>

    <link rel="icon" href="assets/logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        .dashboard {
            max-width: 950px;
            margin: 40px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        /* 🔥 INPUT GRID */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }

        .input-group input {
            margin-top: 4px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        thead th {
            text-align: left;
            padding: 10px;
            opacity: 0.8;
        }

        tbody td {
            padding: 14px;
        }

        .empty {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }

        /* 🔥 PROGRESS */
        .bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 6px;
        }

        .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        .low-bar .fill {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 18px;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 20px;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 2px;
            top: 2px;
            background: white;
            border-radius: 50%;
            transition: .3s;
        }

        input:checked+.slider {
            background: #22c55e;
        }

        input:checked+.slider::before {
            transform: translateX(18px);
        }

        .time-info {
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h2>AttendX / Take Attendance</h2>
            <button class="btn" onclick="goBack()">← Back</button>
        </div>

        <!-- COURSE INFO -->
        <div class="card">
            <p><b>Course:</b> <span id="subject"></span></p>
            <p><b>Department:</b> <span id="department"></span></p>
            <p><b>Program:</b> <span id="program"></span></p>
            <p><b>Semester:</b> <span id="sem"></span></p>
            <p><b>Section:</b> <span id="section"></span></p>
        </div>

        <!-- 🔥 DATE + TIME CONTROLS -->
        <div class="card">

            <div class="input-grid">

                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="date">
                </div>

                <div class="input-group">
                    <label>Start Time</label>
                    <input type="time" id="classTime">
                </div>

                <div class="input-group">
                    <label>No. of Classes</label>
                    <input type="number" id="numClasses" min="1" max="8" value="1">
                </div>

                <div class="input-group">
                    <label>Current Time</label>
                    <input type="text" id="currentTime" readonly>
                </div>

            </div>

            <div class="time-info">
                <p><b>Time Range:</b> <span id="timeRange">--</span></p>
            </div>

        </div>

        <!-- TABLE -->
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>Attendance</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="studentRows">
                    <tr>
                        <td colspan="4" class="empty">
                            Loading students...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button id="submitBtn" class="btn" onclick="submitAttendance(this)">
            Submit Attendance
        </button>

    </div>

    <script src="mockData.js"></script>
    <script src="attendance.js"></script>

</body>

</html>
