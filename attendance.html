<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AttendX / Take Attendance</title>

    <link rel="icon" href="assets/logo.png">

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            max-width: 950px;
            margin: 40px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-top h1 {
            font-size: 28px;
            font-weight: 600;
        }

        /* 🔥 EDIT BUTTON (FIXED RIGHT + PREMIUM) */
        .header-top .btn {
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
        }

        .header-top .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            padding: 4px 10px !important;
            font-size: 11px !important;
            width: auto;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            backdrop-filter: blur(6px);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* ===== SUBMIT ===== */
        #submitBtn {
            display: block;
            margin: 20px auto 0;
            padding: 10px 20px;
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        /* ===== INPUT GRID ===== */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }

        .input-group input {
            margin-top: 4px;
            padding: 9px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            max-width: 260px;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== PROGRESS BAR ===== */
        .bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 6px;
        }

        .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        /* ===== ATTENDANCE BUTTON ===== */
        .status-btn {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            transition: all 0.25s ease;
        }

        .status-btn:hover {
            transform: translateY(-1px) scale(1.05);
        }

        .status-btn:active {
            transform: scale(0.95);
        }

        .status-btn.present.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }

        .status-btn.absent.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        /* ===== TIME INFO ===== */
        .time-info {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.8;
        }

        /* ===== LOADING ===== */
        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }

        /* ===== TABLE LOADER ===== */
        .loader-row {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== SHAKE ===== */
        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-4px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.3s ease;
            border: 1px solid #ef4444 !important;
        }
        
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header">

            <div class="header-top">
                <h1>AttendX / Take Attendance</h1>
                <button class="btn" onclick="editAttendance(event)">Edit Attendance</button>
            </div>

            <!-- 🔥 FIX: added back-btn class -->
            <button class="btn back-btn" onclick="goBack(event)">← Back</button>

        </div>

        <div class="card">
            <p><b>Course:</b> <span id="subject"></span></p>
            <p><b>Department:</b> <span id="department"></span></p>
            <p><b>Program:</b> <span id="program"></span></p>
            <p><b>Semester:</b> <span id="sem"></span></p>
            <p><b>Section:</b> <span id="section"></span></p>
        </div>

        <div class="card">
            <div class="input-grid">
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="date">
                </div>

                <div class="input-group">
                    <label>Start Time</label>
                    <input type="time" id="classTime">
                </div>

                <div class="input-group">
                    <label>No. of Classes</label>
                    <input type="number" id="numClasses" value="1">
                </div>

                <div class="input-group">
                    <label>Current Time</label>
                    <input type="text" id="currentTime" readonly>
                </div>
            </div>

            <div class="time-info">
                <p><b>Class Time :</b> <span id="timeRange">--</span></p>
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn" onclick="markAll(true, event)">Mark All Present</button>
            <button class="btn" onclick="markAll(false, event)">Mark All Absent</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>Attendance</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="studentRows">
                    <tr>
                        <td colspan="4" class="loader-row">
                            <div class="spinner"></div>
                            <p>Loading students...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button id="submitBtn" class="btn" onclick="submitAttendance(this)">
            Submit Attendance
        </button>

    </div>

    <script src="mockData.js"></script>
    <script src="attendance.js"></script>

</body>

</html>
