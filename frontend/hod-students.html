<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AttendX / HOD / Students</title>

    <style>
        /* ===== BODY ===== */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        /* ===== GLOW ===== */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #5f5cff55;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed55;
            bottom: -100px;
            right: -100px;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        /* ===== TITLE ===== */
        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow:
                0 0 10px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(139, 92, 246, 0.15);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* ===== BUTTONS ===== */
        button {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px 5px 15px 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(95, 92, 255, 0.5);
        }

        /* ===== SPINNER ===== */
        button.loading {
            pointer-events: none;
        }

        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.04);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .cie-controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(180px, 1fr)) auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 20px;
        }

        .cie-controls label {
            display: block;
            font-size: 12px;
            color: #cbd5f5;
            margin-bottom: 6px;
        }

        .cie-controls input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(15, 23, 42, 0.8);
            color: #e5e7eb;
            outline: none;
        }

        /* ===== TABLE WRAPPER (🔥 NEW) ===== */
        .table-wrapper {
            max-height: 420px;
            overflow-y: auto;
            border-radius: 12px;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* ===== STICKY HEADER (🔥 NEW) ===== */
        thead {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 2;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
        }

        /* ===== HEADER TEXT ===== */
        th {
            font-size: 13px;
            color: #cbd5f5;
        }

        /* ===== ROW ===== */
        tbody tr {
            background: rgba(255, 255, 255, 0.03);
            transition: 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== STATUS COLORS ===== */
        td.low {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-weight: 600;
            border-radius: 6px;
        }

        td.mid {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            font-weight: 600;
            border-radius: 6px;
        }

        td.high {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            font-weight: 600;
            border-radius: 6px;
        }

        @media (max-width: 760px) {
            body {
                min-height: 100vh;
                overflow-x: hidden;
            }

            body::before,
            body::after {
                width: 260px;
                height: 260px;
                filter: blur(90px);
            }

            .dashboard {
                width: calc(100vw - 24px);
                margin: 12px auto;
                padding: 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
                line-height: 1.2;
            }

            button {
                width: 100%;
                min-height: 42px;
                margin-right: 0;
            }

            .card {
                display: grid;
                gap: 8px;
            }

            .cie-controls {
                grid-template-columns: 1fr;
            }

            .table-wrapper {
                max-height: none;
                overflow-x: auto;
                overflow-y: visible;
            }

            table {
                min-width: 760px;
                font-size: 13px;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <h1>AttendX / HOD Dashboard / Students Details</h1>

        <button onclick="goBack(this)">← Go Back</button>
        <button onclick="exportClassReport(this)">Export Class Report</button>

        <!-- INFO CARD -->
        <div class="card">
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="cie-controls">
            <div>
                <label>CIE 1 Start Date</label>
                <input type="date" id="cie1Date">
            </div>
            <div>
                <label>CIE 2 Start Date</label>
                <input type="date" id="cie2Date">
            </div>
            <button onclick="applyCieDates(this)">Apply CIE Dates</button>
        </div>

        <!-- TABLE -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr id="tableHead">
                        <th>USN</th>
                        <th>Name</th>
                        <th>Parent Phone No</th>
                    </tr>
                </thead>

                <tbody id="studentRows"></tbody>
            </table>
        </div>

    </div>

    
    <script src="utils.js"></script>
    <script src="hod-students.js"></script>

</body>

</html>
