<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX Student Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page student">

    <div class="login-container">

        <!-- Logo -->
        <img src="assets/logo.png" class="college-logo">

        <!-- college info -->
        <div class="college-info">
            <h2 class="college-name">Atria Institute of Technology</h2>
            <p class="college-location">Hebbal, Bengaluru</p>
            <p class="college-status">(Autonomous Institution)</p>
        </div>

        <h3 class="system-title">AttendX Student Portal</h3>

        <!-- FORM -->
        <form id="studentForm" onsubmit="return false;">

            <div class="input-group">
                <label>Student ID</label>
                <input type="text" id="studentId" placeholder=" " required>
            </div>

            <div class="input-group password-field">
                <label>Password</label>
                <input type="password" id="password" placeholder=" " required>
                <i id="eyeIcon" class="fa-solid fa-eye eye"></i>
            </div>

            <div class="form-extra">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <!-- 🔥 BUTTON FIXED -->
            <button id="loginBtn" type="button" onclick="handleStudentLogin(event)">
                <span class="btn-text">Login</span>
                <span class="btn-loader"></span>
            </button>

        </form>

        <p id="error" class="error-text"></p>

        <a href="javascript:void(0)" onclick="goHome()" style="display: block; text-align: center; margin-top: 20px; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 13px; transition: 0.3s; cursor: pointer;" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">
            <i class="fa-solid fa-arrow-left"></i> Back to Portal
        </a>

    </div>

    <!-- 🔥 IMPORTANT ORDER -->
    
    <script src="utils.js"></script>
    <script src="student-login.js"></script>

</body>

</html>
