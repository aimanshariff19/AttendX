<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX / Change Password</title>

    <style>
        /* ===== BODY ===== */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== GLOW ===== */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #5f5cff44;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed44;
            bottom: -100px;
            right: -100px;
        }

        /* ===== CONTAINER ===== */
        .dashboard {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeIn 0.6s ease;
        }

        /* ===== HEADER ===== */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .back-btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-3px);
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        /* ===== INPUT GROUP ===== */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        /* ===== EYE ICON ===== */
        .eye {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .eye:hover { opacity: 1; }

        /* ===== STRENGTH BAR ===== */
        .strength-bar {
            height: 4px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 12px;
            overflow: hidden;
        }

        #strengthFill {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== BUTTON ===== */
        #updateBtn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            margin-top: 10px;
        }

        #updateBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5);
        }

        /* ===== LOADING ===== */
        button.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== MESSAGE BOX ===== */
        .message-box {
            font-size: 13px;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            animation: shake 0.4s ease;
        }

        .message-box.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .message-box.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h1>Change Password</h1>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>

        <div class="card">
            <div id="messageBox" class="message-box"></div>

            <div class="input-group">
                <label>Current Password</label>
                <input type="password" id="oldPass" placeholder="Enter current password">
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPass" placeholder="Enter new password">
                <span class="eye" id="eyeNew">👁</span>
            </div>

            <div class="strength-bar">
                <div id="strengthFill"></div>
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPass" placeholder="Confirm new password">
                <span class="eye" id="eyeConfirm">👁</span>
            </div>

            <button id="updateBtn">
                <span>Update Password</span>
            </button>
        </div>

    </div>

    <script src="utils.js"></script>
    <script src="change-password.js"></script>

</body>

</html>
