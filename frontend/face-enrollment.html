<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX / Face Enrollment</title>
    <link rel="icon" href="assets/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }
        .dashboard {
            max-width: 950px;
            margin: 40px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn {
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(95, 92, 255, 0.5); }
        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .info-card {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
        }
        .enroll-device {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) 240px;
            gap: 14px;
            align-items: start;
        }
        video {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            object-fit: cover;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.9);
            color: #e5e7eb;
            outline: none;
        }
        .status {
            min-height: 42px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.7);
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.35;
        }
        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 760px) {
            .dashboard { width: calc(100vw - 24px); margin: 12px auto; padding: 16px; }
            h1 { font-size: 24px; line-height: 1.2; }
            .info-card, .enroll-device { grid-template-columns: 1fr; }
            .btn { width: 100%; min-height: 42px; }
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <h1>AttendX / Face Enrollment</h1>
        <button class="btn" onclick="goBack()">Back</button>
        <br><br>

        <div class="card info-card">
            <p><b>Course:</b> <span id="subject"></span></p>
            <p><b>Department:</b> <span id="department"></span></p>
            <p><b>Program:</b> <span id="program"></span></p>
            <p><b>Semester:</b> <span id="sem"></span></p>
            <p><b>Section:</b> <span id="section"></span></p>
        </div>

        <div class="card enroll-device">
            <video id="faceVideo" autoplay muted playsinline></video>
            <div class="controls">
                <select id="studentSelect">
                    <option value="">Loading students...</option>
                </select>
                <button class="btn" onclick="startCamera(this)">Start Camera</button>
                <button class="btn" onclick="enrollFace(this)">Save Student Face</button>
                <div id="enrollStatus" class="status">Enroll each student once on this device before attendance.</div>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="face-enrollment.js"></script>
</body>

</html>
