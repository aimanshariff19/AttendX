<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX CSE Intro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            filter: blur(130px);
            z-index: 0;
        }
        body::before { background: #5f5cff55; top: -120px; left: -120px; }
        body::after { background: #7c3aed55; bottom: -120px; right: -120px; }
        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 55px 55px;
            opacity: 0.25;
        }
        .main {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .logo {
            position: absolute;
            top: 32px;
            left: 45px;
            font-size: 2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .logo span { color: #a78bfa; }
        .status {
            position: absolute;
            top: 38px;
            right: 45px;
            color: #cbd5e1;
            font-size: 0.78rem;
            letter-spacing: 4px;
        }
        .core {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(167,139,250,0.16), rgba(95,92,255,0.05));
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 50px rgba(124,58,237,0.22);
            animation: pulse 4s ease infinite;
        }
        .core::before {
            content: "";
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.16);
            animation: rotate 15s linear infinite;
        }
        .core::after {
            content: "";
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .cse {
            font-size: 4rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 5px;
            color: white;
            text-shadow: 0 0 25px rgba(124,58,237,0.35);
        }
        .title {
            margin-top: 50px;
            font-size: 4rem;
            line-height: 1.1;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
        }
        .title span {
            background: linear-gradient(90deg, #c4b5fd, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            margin-top: 18px;
            color: #94a3b8;
            letter-spacing: 5px;
            font-size: 0.9rem;
        }
        .terminal {
            margin-top: 45px;
            width: 520px;
            text-align: left;
        }
        .line {
            font-family: monospace;
            font-size: 0.95rem;
            color: #dbeafe;
            margin-bottom: 14px;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeLine 0.7s forwards;
        }
        .line:nth-child(1) { animation-delay: 0.3s; }
        .line:nth-child(2) { animation-delay: 1s; }
        .line:nth-child(3) { animation-delay: 1.7s; }
        .loader { margin-top: 40px; width: 520px; }
        .loader-text {
            text-align: center;
            color: #94a3b8;
            font-size: 0.78rem;
            letter-spacing: 4px;
            margin-bottom: 14px;
        }
        .bar {
            width: 100%;
            height: 10px;
            border-radius: 50px;
            overflow: hidden;
            background: rgba(255,255,255,0.08);
        }
        .progress {
            width: 0%;
            height: 100%;
            border-radius: 50px;
            background: linear-gradient(90deg, #5f5cff, #7c3aed);
            box-shadow: 0 0 20px rgba(124,58,237,0.45);
            animation: load 3s ease forwards;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes fadeLine {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes load {
            from { width: 0%; }
            to { width: 100%; }
        }
        @media(max-width: 768px) {
            .logo { left: 20px; top: 20px; font-size: 1.5rem; }
            .status { display: none; }
            .core { width: 140px; height: 140px; }
            .cse { font-size: 3rem; }
            .title { font-size: 2.3rem; }
            .subtitle { letter-spacing: 2px; line-height: 1.7; padding: 0 20px; }
            .terminal,
            .loader { width: 90vw; }
        }
    </style>
</head>

<body>
    <div class="grid"></div>
    <div class="main">
        <div class="logo">Attend<span>X</span></div>
        <div class="status">AI CAMPUS SYSTEM ONLINE</div>
        <div class="core">
            <div class="cse">CSE</div>
        </div>
        <div class="title">
            Computer Science <br>
            <span>Engineering</span>
        </div>
        <div class="subtitle">INTELLIGENCE &bull; AUTOMATION &bull; INNOVATION</div>
        <div class="terminal">
            <div class="line">&gt; Initializing AttendX systems...</div>
            <div class="line">&gt; Connecting HOD dashboard...</div>
            <div class="line">&gt; CSE authentication complete.</div>
        </div>
        <div class="loader">
            <div class="loader-text">LOADING CSE MODULES...</div>
            <div class="bar"><div class="progress"></div></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "hod-dashboard.html";
        }, 3000);
    </script>
</body>

</html>
