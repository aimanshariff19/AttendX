<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX / Forgot Password</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: min(420px, calc(100vw - 32px));
            padding: 40px 32px;
            background: rgba(15, 23, 42, 0.74);
            backdrop-filter: blur(22px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        #resetBtn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        #resetBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: white;
        }

        .success-state {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- INITIAL STATE -->
        <div id="initialState">
            <i class="fa-solid fa-lock-open" style="font-size: 40px; color: #a78bfa; margin-bottom: 20px;"></i>
            <h1>Reset Password</h1>
            <p>Enter your Student/Faculty ID and we'll send instructions to your registered institutional email.</p>

            <div class="input-group">
                <label>Your ID (USN / Faculty ID)</label>
                <input type="text" id="userId" placeholder="e.g. 1AT22CS001" style="width:100%; box-sizing:border-box;">
            </div>

            <button id="resetBtn" onclick="handleReset()">Send Reset Link</button>
            <a href="javascript:history.back()" class="back-link">← Back to Login</a>
        </div>

        <!-- SUCCESS STATE -->
        <div id="successState" class="success-state">
            <i class="fa-solid fa-envelope-circle-check"
                style="font-size: 50px; color: #34d399; margin-bottom: 20px;"></i>
            <h1
                style="background: linear-gradient(90deg, #34d399, #059669); -webkit-background-clip: text; background-clip: text;">
                Email Sent!</h1>
            <p id="successMsg">A reset link has been sent to your registered email address.</p>
            <button id="resetBtn" onclick="window.location.href='/'">Return to Portal</button>
        </div>

    </div>

    <script>
        function handleReset() {
            const id = document.getElementById('userId').value.trim();
            if (!id) {
                alert('Please enter your ID');
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.innerText = 'Sending...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            // Simulate API call
            setTimeout(() => {
                document.getElementById('initialState').style.display = 'none';
                document.getElementById('successState').style.display = 'block';
            }, 1500);
        }
    </script>

</body>

</html>
