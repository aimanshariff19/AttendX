<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX / Reset Password</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Ambient Background Glows */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
        }
        body::before { background: #6366f1; top: -100px; left: -100px; }
        body::after { background: #a78bfa; bottom: -100px; right: -100px; }

        .login-container {
            width: min(420px, calc(100vw - 32px));
            padding: 44px 32px;
            background: rgba(15, 23, 42, 0.74);
            backdrop-filter: blur(22px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: center;
            animation: cardSlide 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }

        @keyframes cardSlide {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 800;
            background: linear-gradient(90deg, #eef2ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #a78bfa;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        #resetBtn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #resetBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        #resetBtn:active {
            transform: translateY(0);
        }

        #resetBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            padding: 8px 16px;
            border-radius: 12px;
            width: 100%;
        }

        .back-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .back-btn.loading .btn-loader {
            display: inline-block;
        }

        .success-state {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Spinner */
        .btn-loader {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: btn-spin 0.8s linear infinite;
        }

        @keyframes btn-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="login-container">
        
        <!-- INITIAL STATE -->
        <div id="initialState">
            <div style="width: 60px; height: 60px; background: rgba(167, 139, 250, 0.1); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto; border: 1px solid rgba(167, 139, 250, 0.2);">
                <i class="fa-solid fa-key" style="font-size: 24px; color: #a78bfa;"></i>
            </div>
            <h1>Forgot Password</h1>
            <p id="roleDescription">Enter your details and we'll send recovery instructions to your registered institutional email.</p>

            <div class="input-group">
                <label id="idLabel">User ID</label>
                <input type="text" id="userId" placeholder="Enter your ID">
            </div>

            <button id="resetBtn" onclick="handleReset()">
                <span id="btnText">Send Reset Link</span>
                <span id="btnLoader" class="btn-loader"></span>
            </button>
            
            <button class="back-btn" onclick="this.classList.add('loading'); setTimeout(goBack, 100)">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Login</span>
                <span class="btn-loader" style="width:12px; height:12px; border-width:1.5px;"></span>
            </button>
        </div>

        <!-- SUCCESS STATE -->
        <div id="successState" class="success-state">
            <div style="width: 70px; height: 70px; background: rgba(52, 211, 153, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto; border: 1px solid rgba(52, 211, 153, 0.2);">
                <i class="fa-solid fa-check" style="font-size: 30px; color: #34d399;"></i>
            </div>
            <h1 style="background: linear-gradient(90deg, #34d399, #10b981); -webkit-background-clip: text; background-clip: text;">Check your Email</h1>
            <p>We have sent a password recovery link to your registered institutional email address.</p>
            <button id="resetBtn" onclick="window.location.href='/'" style="background: #10b981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);">Return to Home</button>
        </div>

    </div>

    <script>
        // Parse Role
        const params = new URLSearchParams(window.location.search);
        const role = params.get('role') || 'student';
        
        const idLabel = document.getElementById('idLabel');
        const userId = document.getElementById('userId');
        const roleDescription = document.getElementById('roleDescription');

        // Dynamic UI based on role
        if (role === 'faculty') {
            idLabel.innerText = "Faculty ID";
            userId.placeholder = "e.g. FAC123";
            roleDescription.innerText = "Enter your Faculty ID and we'll send instructions to your registered staff email.";
        } else if (role === 'hod') {
            idLabel.innerText = "HOD ID";
            userId.placeholder = "e.g. HOD_CSE";
            roleDescription.innerText = "Enter your HOD ID to receive password reset instructions via email.";
        } else {
            idLabel.innerText = "Student USN / ID";
            userId.placeholder = "e.g. 1AT22CS001";
            roleDescription.innerText = "Enter your USN and we'll send instructions to your registered student email.";
        }

        function handleReset() {
            const id = userId.value.trim();
            if (!id) {
                userId.style.borderColor = "#fb7185";
                setTimeout(() => userId.style.borderColor = "", 2000);
                return;
            }

            const btn = document.getElementById('resetBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';

            // Simulate API call
            setTimeout(() => {
                document.getElementById('initialState').style.display = 'none';
                document.getElementById('successState').style.display = 'block';
            }, 1800);
        }

        function goBack() {
            // Determine best back route
            if (role === 'faculty') window.location.href = '/faculty-login.html';
            else if (role === 'hod') window.location.href = '/hod-login.html';
            else window.location.href = '/student-login.html';
        }
    </script>

</body>

</html>
