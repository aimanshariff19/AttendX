<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendX Faculty Dashboard</title>

    <style>
      /* ===== BODY ===== */
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
      }

      /* ===== GLOW ===== */
      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        filter: blur(120px);
        z-index: 0;
      }

      body::before {
        background: #5f5cff55;
        top: -100px;
        left: -100px;
      }

      body::after {
        background: #7c3aed55;
        bottom: -100px;
        right: -100px;
      }

      /* ===== DASHBOARD ===== */
      .dashboard {
        position: relative;
        z-index: 2;
        max-width: 1100px;
        margin: 40px auto;
        padding: 25px;
        /* reduced */
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        animation: fadeIn 0.6s ease;
      }

      /* ===== HEADER ===== */
      .header-actions {
        margin-bottom: 10px;
      }

      h1 {
        margin-bottom: 18px;
        font-size: 30px;
        font-weight: 600;
        background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        text-shadow:
          0 0 10px rgba(139, 92, 246, 0.3),
          0 0 20px rgba(139, 92, 246, 0.15);
        animation: titleGlow 3s linear infinite;
      }

      @keyframes titleGlow {
        0% {
          background-position: 0% center;
        }

        100% {
          background-position: 200% center;
        }
      }

      /* ===== LOGOUT ===== */
      .logout-btn {
        padding: 8px 16px;
        /* reduced */
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #5f5cff, #7c3aed);
        color: white;
        cursor: pointer;
        transition: 0.3s;
        margin-bottom: 20px;
        /* adjusted */
        width: fit-content;
      }

      .logout-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(95, 92, 255, 0.5);
      }

      /* ===== PROFILE ===== */
      .faculty-panel h2 {
        font-size: 22px;
        /* reduced */
        margin-bottom: 3px;
      }

      .dept {
        color: #9ca3af;
        /* softer */
        margin-bottom: 15px;
        font-size: 13px;
      }

      /* ===== STATS ===== */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        /* tighter */
        gap: 12px;
        /* reduced */
        margin-bottom: 20px;
      }

      .course-card {
        background: rgba(255, 255, 255, 0.04);
        /* lighter */
        padding: 14px;
        /* reduced */
        border-radius: 12px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: 0.25s;
      }

      .course-card:hover {
        transform: translateY(-4px);
        /* reduced */
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .course-card h3 {
        font-size: 20px;
        /* reduced */
        margin-bottom: 4px;
      }

      .course-card p {
        font-size: 12px;
        color: #9ca3af;
      }

      /* ===== CARD ===== */
      .card {
        background: rgba(255, 255, 255, 0.04);
        padding: 16px;
        /* reduced */
        border-radius: 14px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* ===== SUBJECTS ===== */
      .subjects {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: flex-start;
      }

      .subject-card {
        width: 260px;
        background: rgba(255, 255, 255, 0.04);
        padding: 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: 0.25s;
      }

      .subject-card:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }

      .subject-card h4 {
        margin-bottom: 4px;
        font-size: 15px;
      }

      .subject-card p {
        font-size: 12px;
        color: #9ca3af;
      }

      /* ===== BUTTON ===== */
      button {
        margin-top: 10px;
        padding: 8px 12px;
        /* reduced */
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #5f5cff, #7c3aed);
        color: white;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: 0.3s;
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(95, 92, 255, 0.5);
      }

      /* ===== LOADING ===== */
      button.loading {
        pointer-events: none;
        opacity: 0.9;
      }

      .btn-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top: 2px solid white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-left: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== ANIMATION ===== */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 760px) {
        body {
          min-height: 100vh;
          overflow-x: hidden;
        }

        body::before,
        body::after {
          width: 260px;
          height: 260px;
          filter: blur(90px);
        }

        .dashboard {
          width: calc(100vw - 24px);
          margin: 12px auto;
          padding: 16px;
          border-radius: 16px;
        }

        h1 {
          font-size: 24px;
          line-height: 1.2;
          margin-bottom: 14px;
        }

        .logout-btn {
          width: 100%;
          margin-bottom: 16px;
        }

        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .subjects {
          flex-direction: column;
        }

        .subject-card {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="dashboard">
      <h1>AttendX / Faculty Dashboard</h1>

      <button class="logout-btn" onclick="logout(this)">
        <span>Logout</span>
      </button>

      <!-- PROFILE -->
      <div class="faculty-panel">
        <div class="faculty-info">
          <h2 id="facultyName">Dr. Kumar</h2>
          <p id="facultyDept">CSE Department</p>
        </div>
      </div>

      <!-- STATS -->
      <div class="cards faculty-stats">
        <div class="course-card">
          <h3 id="courseCount">3</h3>
          <p>Courses</p>
        </div>

        <div class="course-card">
          <h3 id="sectionCount">2</h3>
          <p>Sections</p>
        </div>

        <div class="course-card">
          <h3 id="studentCount">7</h3>
          <p>Students</p>
        </div>

        <div class="course-card">
          <h3 id="facultyId">faculty1</h3>
          <p>Faculty ID</p>
        </div>
      </div>

      <!-- SCHEDULE -->
      <div class="card">
        <h3>Today's Schedule</h3>
        <div id="todaySchedule">No classes today</div>
      </div>

      <!-- SUBJECTS -->
      <h3 style="margin-bottom: 10px">Your Courses</h3>

      <div class="subjects" id="courseCards">
        <div class="subject-card">
          <h4>Data Structures</h4>
          <p>CSE • Sem 3 • Sec A</p>

          <!-- 🔥 FIXED ONLY THIS LINE -->
          <button
            onclick="
              openCourse('Data Structures', 'CSE', 'CSE', '3', 'A', this)
            "
          >
            <span>Take Attendance</span>
          </button>
        </div>
      </div>
    </div>

    <script src="utils.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
