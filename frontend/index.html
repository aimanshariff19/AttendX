<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX / Official Portal</title>

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a78bfa;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* GLOWS */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            filter: blur(150px);
            z-index: 0;
            opacity: 0.4;
        }

        body::before { background: var(--primary); top: -200px; left: -200px; }
        body::after { background: var(--secondary); bottom: -200px; right: -200px; }

        .portal-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            text-align: center;
        }

        .logo-section {
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        .logo-section img {
            width: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
        }

        .logo-section h1 {
            font-size: 36px;
            margin: 0;
            background: linear-gradient(90deg, #fff, #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: #fff; /* Fallback */
            -webkit-text-fill-color: transparent;
        }

        .logo-section p {
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 14px;
            margin-top: 10px;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .portal-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 0.8s ease backwards;
        }

        .portal-card:hover {
            transform: translateY(-15px) scale(1.02);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .portal-card i {
            font-size: 48px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            background-clip: text;
            -webkit-background-clip: text;
            color: var(--primary); /* Fallback */
            -webkit-text-fill-color: transparent;
        }

        .portal-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .portal-card p {
            opacity: 0.5;
            font-size: 14px;
            margin: 0;
        }

        .portal-card:nth-child(1) { animation-delay: 0.1s; }
        .portal-card:nth-child(2) { animation-delay: 0.2s; }
        .portal-card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== FLOATING TILES ===== */
        .floating-tiles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        .floating-tiles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: animateTiles 25s linear infinite;
            bottom: -150px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .floating-tiles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .floating-tiles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .floating-tiles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .floating-tiles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .floating-tiles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .floating-tiles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .floating-tiles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .floating-tiles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .floating-tiles li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .floating-tiles li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes animateTiles {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 8px; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        @media (max-width: 760px) {
            body {
                align-items: flex-start;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 18px 0;
            }

            body::before,
            body::after {
                width: 260px;
                height: 260px;
                filter: blur(90px);
            }

            .portal-container {
                width: calc(100vw - 24px);
                padding: 16px 0;
            }

            .logo-section {
                margin-bottom: 24px;
            }

            .logo-section img {
                width: 78px;
            }

            .logo-section h1 {
                font-size: 28px;
                line-height: 1.2;
            }

            .portal-grid {
                grid-template-columns: 1fr;
                gap: 14px;
                margin-top: 24px;
            }

            .portal-card {
                padding: 28px 20px;
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>
    <ul class="floating-tiles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <div class="portal-container">
        
        <div class="logo-section">
            <img src="assets/logo.png" alt="Atria Logo">
            <h1>Atria AttendX ERP</h1>
            <p>Select Your Access Portal</p>
        </div>

        <div class="portal-grid">
            
            <!-- STUDENT -->
            <a href="student-login.html" class="portal-card">
                <i class="fa-solid fa-user-graduate"></i>
                <h2>Student</h2>
            </a>

            <!-- FACULTY -->
            <a href="faculty-login.html" class="portal-card">
                <i class="fa-solid fa-chalkboard-user"></i>
                <h2>Faculty</h2>
            </a>

            <!-- HOD -->
            <a href="hod-login.html" class="portal-card">
                <i class="fa-solid fa-user-tie"></i>
                <h2>HOD</h2>
            </a>

            <!-- ADMIN -->
            <a href="admin-login.html" class="portal-card">
                <i class="fa-solid fa-user-shield"></i>
                <h2>Admin</h2>
            </a>

        </div>

    </div>

</body>

</html>
