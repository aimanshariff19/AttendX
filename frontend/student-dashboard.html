<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX Student Dashboard</title>

    <style>
        /* ===== BODY ===== */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
        }

        /* ===== GLOW ===== */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #5f5cff55;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed55;
            bottom: -100px;
            right: -100px;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.6s ease;
        }

        /* ===== HEADER ===== */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(95, 92, 255, 0.4);
        }

        /* ===== STATS CARDS ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
        }

        .stat-card h3 {
            font-size: 20px;
            margin: 0 0 4px 0;
            color: #a78bfa;
        }

        .stat-card p {
            font-size: 12px;
            color: #9ca3af;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== PROFILE INFO ===== */
        .profile-info {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            border-left: 4px solid var(--primary, #6366f1);
            display: flex;
            flex-wrap: wrap;
            gap: 10px 30px;
            font-size: 14px;
        }

        .profile-info span {
            color: #9ca3af;
            margin-right: 5px;
        }

        /* ===== TABLE ===== */
        .table-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: rgba(255, 255, 255, 0.05);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #a78bfa;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        th:nth-child(3), th:nth-child(4), th:nth-child(5), th:nth-child(6) {
            text-align: center;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* ===== PERCENTAGE CHIPS ===== */
        .percent-chip {
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12px;
            display: inline-block;
        }

        /* ===== PROGRESS BAR ===== */
        .bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
        }

        /* ===== LOADING ===== */
        button.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 760px) {
            body {
                overflow-x: hidden;
            }

            body::before,
            body::after {
                width: 260px;
                height: 260px;
                filter: blur(90px);
            }

            .dashboard {
                width: calc(100vw - 24px);
                margin: 12px auto;
                padding: 16px;
                border-radius: 16px;
            }

            .header-actions {
                align-items: stretch;
                flex-direction: column;
                gap: 12px;
            }

            h1 {
                font-size: 24px;
                line-height: 1.2;
            }

            .btn-group {
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn-group button {
                width: 100%;
                min-height: 42px;
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .profile-info {
                display: grid;
                grid-template-columns: 1fr;
                padding: 14px;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 680px;
                font-size: 13px;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h1>AttendX / Student Dashboard</h1>
            <div class="btn-group">
                <button id="changePasswordBtn">
                    <span>Change Password</span>
                </button>
                <button id="logoutBtn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);">
                    <span>Logout</span>
                </button>
            </div>
        </div>

        <!-- PROFILE STRIP -->
        <div class="profile-info">
            <div><span>Name:</span> <strong id="studentName">Loading...</strong></div>
            <div><span>USN:</span> <strong id="studentUSN">---</strong></div>
            <div><span>Department:</span> <strong id="department">---</strong></div>
        </div>

        <!-- STATS GRID -->
        <div class="cards">
            <div class="stat-card">
                <h3 id="sem">---</h3>
                <p>Current Semester</p>
            </div>
            <div class="stat-card">
                <h3 id="section">---</h3>
                <p>Section</p>
            </div>
            <div class="stat-card">
                <h3 id="overallPercent">0%</h3>
                <p>Overall Attendance</p>
            </div>
            <div class="stat-card">
                <h3 id="program">---</h3>
                <p>Program</p>
            </div>
        </div>

        <!-- ATTENDANCE TABLE -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Code</th>
                        <th>Conducted</th>
                        <th>Present</th>
                        <th>Absent</th>
                        <th style="width: 150px;">Attendance</th>
                    </tr>
                </thead>
                <tbody id="subjectRows">
                    <!-- Rows will be injected by JS -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="utils.js"></script>
    <script src="student-dashboard.js"></script>

</body>

</html>
