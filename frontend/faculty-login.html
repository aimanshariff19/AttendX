<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX Faculty Login</title>

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page faculty">

    <div class="login-container">

        <!-- LOGO -->
        <img src="assets/logo.png" class="college-logo" alt="Atria Logo">

        <!-- COLLEGE INFO -->
        <div class="college-info">
            <h2 class="college-name">Atria Institute of Technology</h2>
            <p class="college-location">Hebbal, Bengaluru</p>
            <p class="college-status">(Autonomous Institution)</p>
        </div>

        <!-- TITLE -->
        <h3 class="system-title">AttendX Faculty Portal</h3>

        <!-- FORM -->
        <form id="loginForm" autocomplete="on">

            <!-- USERNAME -->
            <div class="input-group">
                <label for="username">Faculty ID</label>
                <input type="text" id="username" required autocomplete="username">
            </div>

            <!-- PASSWORD -->
            <div class="input-group password-field">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
                <i id="eyeIcon" class="fa-solid fa-eye eye"></i>
            </div>

            <!-- EXTRA OPTIONS -->
            <div class="form-extra">
                <div class="remember">
                    <input type="checkbox" id="rememberMe"> 
                    <label for="rememberMe">Remember me</label>
                </div>
                <button type="button" class="forgot" onclick="this.classList.add('loading'); setTimeout(() => window.location.href='/forgot-password.html?role=faculty', 150)">
                    <span>Forgot password?</span>
                    <i class="fa-solid fa-arrow-right" style="font-size: 10px; opacity: 0.6;"></i>
                    <span class="btn-loader"></span>
                </button>
            </div>

            <!-- 🔥 BUTTON UPDATED -->
            <button id="loginBtn" type="button" onclick="handleFacultyLogin(event)">
                <span class="btn-text">Login</span>
                <span class="btn-loader"></span>
            </button>

        </form>

        <!-- ERROR -->
        <button type="button" onclick="this.classList.add('loading'); setTimeout(() => window.location.href='/', 150)" style="width:fit-content; margin:8px auto 0 auto; background:transparent; border:none; color:rgba(255,255,255,0.4); padding:5px 10px; cursor:pointer; font-size:12px; transition:0.3s; display:flex; align-items:center; justify-content:center; text-align:center;" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">
            <i class="fa-solid fa-arrow-left"></i> 
            <span style="margin-left: 8px;">Back to Portal</span>
            <span class="btn-loader"></span>
        </button>

        <p id="error" class="error-text" style="margin-top: 10px; min-height: 15px; text-align: center; color: #fb7185; font-size: 13px;"></p>

    </div>

    <!-- JS -->
    
    <script src="utils.js?v=1.2"></script>
    <script src="login.js?v=1.2"></script>
    
</body>

</html>
