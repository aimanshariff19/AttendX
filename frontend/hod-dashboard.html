<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX / HOD Dashboard</title>

    <style>
        /* ===== BODY ===== */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        /* ===== GLOW ===== */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #5f5cff55;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed55;
            bottom: -100px;
            right: -100px;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        /* ===== TITLE ===== */
        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow:
                0 0 10px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(139, 92, 246, 0.15);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* ===== LOGOUT ===== */
        .logout-btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(95, 92, 255, 0.5);
        }

        /* ===== UNIVERSAL BUTTON HOVER ===== */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(95, 92, 255, 0.5);
        }

        /* ===== PROFILE ===== */
        .faculty-panel h2 {
            font-size: 22px;
        }

        .faculty-panel p {
            color: #9ca3af;
            font-size: 13px;
        }

        /* ===== STATS ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .course-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            transition: 0.25s;
        }

        .course-card:hover {
            transform: translateY(-4px);
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        /* ===== DROPDOWN ===== */
        .filter-bar select {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(15, 23, 42, 0.8);
            color: #e5e7eb;
            backdrop-filter: blur(10px);
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-bar select:hover {
            background: rgba(30, 41, 59, 0.9);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .filter-bar select option {
            background: #0f172a;
            color: white;
        }

        /* ===== CARD ===== */
        .subject-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            min-height: 170px;
            height: 180px;
        }

        /* ===== 🔥 FIXED GRID (ONLY CHANGE) ===== */
        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, 240px);
            justify-content: flex-start;
            gap: 18px;
        }

        .subject-card:hover {
            transform: translateY(-4px);
        }

        /* ===== TEXT ===== */
        .subject-card p {
            font-size: 13px;
            color: #9ca3af;
        }

        /* ===== BUTTON ===== */
        button {
            margin-top: auto;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            font-weight: 600;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== SPINNER ===== */
        button.loading {
            pointer-events: none;
        }

        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 760px) {
            body {
                min-height: 100vh;
                overflow-x: hidden;
            }

            body::before,
            body::after {
                width: 260px;
                height: 260px;
                filter: blur(90px);
            }

            .dashboard {
                width: calc(100vw - 24px);
                margin: 12px auto;
                padding: 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
                line-height: 1.2;
                margin-bottom: 14px;
            }

            .logout-btn {
                width: 100%;
                min-height: 42px;
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .filter-bar {
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .filter-bar select,
            .filter-bar button {
                width: 100%;
                min-height: 42px;
            }

            .subjects {
                grid-template-columns: 1fr;
            }

            .subject-card {
                width: 100%;
                height: auto;
                min-height: 150px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>AttendX / HOD Dashboard</h1>

        <button class="logout-btn" onclick="logout(this)">
            <span>Logout</span>
        </button>

        <div class="faculty-panel">
            <h2 id="hodName"></h2>
            <p id="hodDept"></p>
        </div>

        <div class="cards">
            <div class="course-card">
                <h3 id="totalCourses"></h3>
                <p>Courses</p>
            </div>
            <div class="course-card">
                <h3 id="totalSections"></h3>
                <p>Sections</p>
            </div>
            <div class="course-card">
                <h3 id="totalStudents"></h3>
                <p>Students</p>
            </div>
            <div class="course-card">
                <h3 id="totalFaculty"></h3>
                <p>Faculty</p>
            </div>
        </div>

        <div class="filter-bar">
            <select id="filterDept"></select>
            <select id="filterProgram"></select>
            <select id="filterSem"></select>
            <select id="filterSection"></select>

            <button onclick="applyFilters(this)">
                <span>Apply</span>
            </button>
        </div>

        <div class="subjects" id="courseCards"></div>

    </div>

    
    
    <script src="utils.js"></script>
    <script src="hod-dashboard.js"></script>

</body>

</html>
