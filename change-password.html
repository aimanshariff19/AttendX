<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            width: 100%;
            max-width: 420px;
        }

        /* ===== HEADER ===== */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            -webkit-background-clip: text;
            color: transparent;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            padding: 6px 10px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* ===== INPUT GROUP ===== */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 13px;
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: 10px;
            font-size: 12px;
            opacity: 0.6;
            transition: 0.2s;
            pointer-events: none;
        }

        .input-group input:focus+label,
        .input-group input:not(:placeholder-shown)+label {
            top: -6px;
            font-size: 10px;
            opacity: 1;
        }

        /* ===== EYE ICON ===== */
        .eye {
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0.7;
        }

        /* ===== STRENGTH BAR ===== */
        .strength-bar {
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            overflow: hidden;
        }

        #strengthFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #22c55e);
            transition: 0.3s;
        }

        /* ===== RULES ===== */
        .rules {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        /* ===== MATCH TEXT ===== */
        .match {
            font-size: 12px;
            margin-bottom: 10px;
        }

        /* ===== MESSAGE BOX ===== */
        .message-box {
            font-size: 12px;
            margin-bottom: 10px;
        }

        /* ===== BUTTON ===== */
        #updateBtn {
            position: relative;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;

            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
            transition: 0.25s;
            cursor: pointer;
            overflow: hidden;
        }

        #updateBtn:hover {
            transform: translateY(-2px);
        }

        /* ===== 🔥 SPINNER STATE ===== */
        #updateBtn.loading {
            pointer-events: none;
            color: transparent;
        }

        #updateBtn.loading::after {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* ===== SUCCESS OVERLAY ===== */
        #successOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .success-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .tick {
            font-size: 28px;
            color: #22c55e;
            margin-bottom: 10px;
        }

        button:active {
            transform: scale(0.96);
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h1>Change Password</h1>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>

        <div class="card">

            <div id="messageBox" class="message-box"></div>

            <div class="input-group">
                <input type="password" id="oldPass" placeholder=" ">
                <label>Old Password</label>
            </div>

            <div class="input-group">
                <input type="password" id="newPass" placeholder=" ">
                <label>New Password</label>
                <span class="eye" id="eyeNew">👁</span>
            </div>

            <div class="strength-bar">
                <div id="strengthFill"></div>
            </div>

            <div class="rules">
                <p id="ruleLen">Min 4 chars</p>
                <p id="ruleUpper">Uppercase</p>
                <p id="ruleNum">Number</p>
                <p id="ruleSpecial">Special char</p>
            </div>

            <div class="input-group">
                <input type="password" id="confirmPass" placeholder=" ">
                <label>Confirm Password</label>
                <span class="eye" id="eyeConfirm">👁</span>
            </div>

            <p id="matchText" class="match"></p>

            <button id="updateBtn">
                <span>Update Password</span>
            </button>

        </div>

    </div>

    <div id="successOverlay">
        <div class="success-box">
            <div class="tick">✔</div>
            <p>Password Updated</p>
        </div>
    </div>

    <script src="mockData.js"></script>
    <script src="change-password.js"></script>

</body>

</html>
