<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AttendX Student Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #8b5cf655;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #6366f155;
            bottom: -100px;
            right: -100px;
        }

        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            cursor: pointer;
        }

        .logout-btn {
            margin-top: 20px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
        }

        thead {
            background: rgba(255, 255, 255, 0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== BAR ===== */
        .bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 6px;
        }

        .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
        }

        .low-bar .fill {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        /* ===== CIRCLE ===== */
        .circle {
            width: 50px;
            height: 50px;
            margin: auto;
            border-radius: 50%;
            position: relative;
            background: conic-gradient(#6366f1 var(--percent), rgba(255, 255, 255, 0.1) 0);
        }

        .circle.low {
            background: conic-gradient(#ef4444 var(--percent), rgba(255, 255, 255, 0.1) 0);
        }

        .circle::after {
            content: attr(data-text);
            position: absolute;
            inset: 5px;
            background: #1e1b4b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .prediction {
            font-size: 11px;
            margin-top: 6px;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h1>AttendX / Student Dashboard</h1>
            <button id="changePasswordBtn">Change Password</button>
        </div>

        <div class="card">
            <p><strong>Name:</strong> <span id="studentName"></span></p>
            <p><strong>USN:</strong> <span id="studentUSN"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Code</th>
                    <th>Classes</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Attendance</th>
                </tr>
            </thead>

            <tbody id="subjectRows"></tbody>
        </table>

        <button id="logoutBtn" class="logout-btn">Logout</button>

    </div>

    <script src="mockData.js"></script>
    <script src="student-dashboard.js"></script>

</body>

</html>
