<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>AttendX Student Dashboard</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        /* GLOW BLOBS */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #8b5cf655;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #6366f155;
            bottom: -100px;
            right: -100px;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        /* ===== HEADER ===== */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;

            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;

            display: inline-block;
        }

        /* ===== BUTTON ===== */
        button {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.25s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
        }

        /* ===== 🔥 GLOBAL SPINNER ===== */
        button.loading {
            pointer-events: none;
            color: transparent !important;
        }

        button.loading::after {
            content: "";
            width: 14px;
            height: 14px;

            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;

            border-radius: 50%;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px 20px;
            font-size: 13px;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
        }

        thead th {
            padding: 12px;
            text-align: center;
            opacity: 0.7;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        tbody td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        td:not(:last-child),
        th:not(:last-child) {
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ===== LOGOUT ===== */
        .logout-btn {
            margin-top: 16px;
            width: 100%;
        }

        /* 🔥 KEEP BUTTON SIZE STABLE DURING SPINNER */
        button span {
            display: inline-block;
        }

        /* OPTIONAL: smoother feel */
        button.loading span {
            visibility: hidden;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h1>AttendX / Student Dashboard</h1>
            <button id="changePasswordBtn">
                <span>Change Password</span>
            </button>
        </div>

        <div class="card">
            <p><strong>Name:</strong> <span id="studentName"></span></p>
            <p><strong>USN:</strong> <span id="studentUSN"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Subject Code</th>
                    <th>Classes</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Attendance</th>
                </tr>
            </thead>

            <tbody id="subjectRows"></tbody>
        </table>

        <button id="logoutBtn" class="logout-btn">
            <span>Logout</span>
        </button>

    </div>

    <script src="mockData.js"></script>
    <script src="student-dashboard.js"></script>

</body>

</html>
