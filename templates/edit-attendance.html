<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        .dashboard {
            max-width: 950px;
            margin: 30px auto;
            padding: 22px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            backdrop-filter: blur(20px);
        }

        /* TITLE */
        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow:
                0 0 10px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(139, 92, 246, 0.15);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* CARD */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }

        /* CONTROLS */
        .attendance-controls {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
        }

        .attendance-controls div {
            display: flex;
            flex-direction: column;
            width: 220px;
        }

        .attendance-controls input,
        .attendance-controls select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
            color: white;
        }

        /* BUTTON */
        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* BULK */
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* 🔥 GLASS TABLE */
        .table-card {
            background: rgba(255, 255, 255, 0.06);
            padding: 18px;
            border-radius: 18px;

            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(255, 255, 255, 0.08);
            padding: 16px;
            text-align: center;
        }

        tbody td {
            padding: 16px;
            text-align: center;
        }

        tbody tr {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* 🔥 STATUS BUTTON (NO SWEEP) */
        .status-btn {
            padding: 6px 16px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
        }

        /* GREEN */
        .status-btn.present {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        /* RED */
        .status-btn.absent {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* SIMPLE HOVER */
        .status-btn:hover {
            transform: scale(1.05);
        }

        /* INPUT */
        tbody input {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            color: white;
        }

        /* SHAKE */
        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.3s ease;
            border: 1px solid #ef4444 !important;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="attendance-controls">

            <div>
                <label>📅 Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div>
                <label>⏰ Class Time</label>
                <select id="timeSelect">
                    <option value="">Select date first</option>
                </select>
            </div> <br>

            <div style="display:flex; align-items:flex-end; margin-left:auto;">
                <button class="btn load-btn" onclick="loadAttendance(event)">
                    Load
                </button>
            </div>

        </div>

        <div class="bulk-actions">
            <button class="btn" onclick="markAll(true, event)">Mark All Present</button>
            <button class="btn" onclick="markAll(false, event)">Mark All Absent</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>%</th>
                        <th>Status</th>
                        <th>Reason</th>
                    </tr>
                </thead>
                <tbody id="studentRows"></tbody>
            </table>
        </div>

    </div>

    <script src="/static/edit.js"></script>

</body>

</html>
