<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        /* MAIN */
        .dashboard {
            max-width: 950px;
            margin: 30px auto;
            padding: 22px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            backdrop-filter: blur(20px);
        }

        /* 🔥 TITLE (CLEAN GLOW) */
        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow:
                0 0 10px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(139, 92, 246, 0.15);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* CARD */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* CONTROLS */
        .attendance-controls {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 18px;
        }

        .attendance-controls div {
            display: flex;
            flex-direction: column;
            width: 220px;
        }

        .attendance-controls input,
        .attendance-controls select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
            color: white;
        }

        /* 🔥 LOAD BUTTON RIGHT */
        .load-wrapper {
            margin-left: auto;
            display: flex;
            align-items: flex-end;
        }

        /* BUTTON */
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            transition: 0.2s;
        }

        /* 🔥 UPDATE BUTTON (GLASS PURPLE) */
        .update-btn {
            margin-top: 18px;

            padding: 10px 10px;
            border-radius: 12px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;

            font-weight: 600;
            font-size: 14px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            box-shadow:
                0 6px 20px rgba(99, 102, 241, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);

            transition: all 0.25s ease;
        }

        /* 🔥 HOVER EFFECT */
        .update-btn:hover {
            transform: translateY(-2px) scale(1.02);

            box-shadow:
                0 10px 25px rgba(139, 92, 246, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* 🔥 CLICK */
        .update-btn:active {
            transform: scale(0.96);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* BULK */
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* 🔥 TABLE CONTAINER */
        .table-container {
            background: rgba(255, 255, 255, 0.06);
            padding: 18px;
            border-radius: 16px;

            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* HEADER */
        thead th {
            background: rgba(255, 255, 255, 0.08);
            padding: 14px;
            text-align: left;
            font-weight: 600;
            color: #e5e7eb;

            /* ONLY INNER COLUMN LINE */
            border-right: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* REMOVE RIGHT EDGE */
        thead th:last-child {
            border-right: none;
        }

        /* BODY */
        tbody td {
            padding: 14px;
            color: #d1d5db;

            /* horizontal line */
            border-top: 1px solid rgba(255, 255, 255, 0.08);

            /* vertical inner line */
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* REMOVE RIGHT EDGE */
        tbody td:last-child {
            border-right: none;
        }

        /* 🔥 IMPORTANT: REMOVE LEFT EDGE COMPLETELY */
        thead th:first-child,
        tbody td:first-child {
            border-left: none;
        }

        /* HOVER */
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .status-btn {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            transition: all 0.25s ease;
        }

        .status-btn:hover {
            transform: translateY(-1px) scale(1.05);
        }

        .status-btn:active {
            transform: scale(0.95);
        }

        .status-btn.present.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }

        .status-btn.absent.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        /* INPUT */
        tbody input {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: white;
        }

        /* ===== SHAKE ===== */
        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.3s ease;
        }

        /* ===== SPINNER ===== */
        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="attendance-controls">

            <div>
                <label>Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div>
                <label>Class Time</label>
                <select id="timeSelect">
                    <option>Select date first</option>
                </select>
            </div>

            <!-- ✅ RIGHT ALIGNED -->
            <div class="load-wrapper">
                <button class="btn" onclick="loadAttendance(event)">Load</button>
            </div>

        </div>

        <div class="bulk-actions">
            <button class="btn" onclick="markAll(true, event)">Mark All Present</button>
            <button class="btn" onclick="markAll(false, event)">Mark All Absent</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>Attendance</th>
                        <th>Status</th>
                        <th>Reason</th>
                    </tr>
                </thead>

                <tbody id="studentRows"></tbody>

            </table>
        </div>

        <button class="update-btn" onclick="updateAttendance(event)">
            Update Attendance
        </button>

    </div>

    <script src="/static/edit.js"></script>

</body>

</html>
