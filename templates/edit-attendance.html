<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        .dashboard {
            max-width: 950px;
            margin: 30px auto;
            padding: 22px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
        }

        /* ===== CONTROLS ===== */
        .attendance-controls {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .attendance-controls div {
            display: flex;
            flex-direction: column;
            font-size: 13px;
            width: 220px;
        }

        .attendance-controls input,
        .attendance-controls select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
            color: white;
        }

        /* ===== BUTTON ===== */
        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* ===== TABLE WRAPPER ===== */
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 16px;
            margin-top: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(255, 255, 255, 0.08);
            padding: 14px;
            font-weight: 600;
        }

        tbody td {
            padding: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* ===== 🔥 STATUS BUTTON ===== */
        .status-btn {
            padding: 5px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .status-btn.present {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        .status-btn.absent {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        .status-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3),
                0 0 18px rgba(139, 92, 246, 0.5);
        }

        .status-btn:active {
            transform: scale(0.95);
        }

        /* ===== INPUT FIX ===== */
        tbody input {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            color: #d1d5db;
            font-size: 12px;
        }

        tbody input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        tbody input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.4);
            outline: none;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="attendance-controls">

            <div class="input-group">
                <label>📅 Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div class="input-group">
                <label>⏰ Class Time</label>
                <select id="timeSelect">
                    <option value="">Select date first</option>
                </select>
            </div>

            <div>
                <button class="btn" onclick="loadAttendance(event)">
                    Load
                </button>
            </div>

        </div>

        <div class="bulk-actions">
            <button class="btn" onclick="markAll(true)">Mark All Present</button>
            <button class="btn" onclick="markAll(false)">Mark All Absent</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>%</th>
                        <th>Status</th>
                        <th>Reason</th>
                    </tr>
                </thead>
                <tbody id="studentRows"></tbody>
            </table>
        </div>

    </div>

    <script src="/static/edit.js"></script>

</body>

</html>
