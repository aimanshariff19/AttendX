<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
        }

        .dashboard {
            max-width: 950px;
            margin: 30px auto;
            padding: 22px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow:
                0 0 10px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(139, 92, 246, 0.15);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
        }

        .attendance-controls {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .attendance-controls div {
            display: flex;
            flex-direction: column;
            font-size: 13px;
            width: 220px;
        }

        .attendance-controls input,
        .attendance-controls select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
            color: white;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.6);
        }

        .load-btn {
            height: 40px;
            padding: 0 18px;
            display: flex;
            align-items: center;
        }

        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .bulk-actions button:first-child {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .bulk-actions button:last-child {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* ===== TABLE ===== */
        .table-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th,
        td {
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            text-align: center;
        }

        th {
            background: rgba(255, 255, 255, 0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== STATUS ===== */
        .status-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .status-btn.present.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .status-btn.absent.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* ===== SHAKE ===== */
        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.3s ease;
            border: 1px solid #ef4444 !important;
        }

        /* ===== 🔥 PREMIUM BUTTON EFFECT ===== */
        .btn {
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        /* 🔥 HOVER GLOW */
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.6);
        }

        /* 💧 LIGHT SWEEP EFFECT */
        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.4),
                    transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* 🔥 CLICK PRESS EFFECT */
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* ===== STATUS BUTTON HOVER ===== */
        .status-btn {
            position: relative;
            overflow: hidden;
            transition: 0.25s;
        }

        .status-btn:hover {
            transform: scale(1.05);
        }

        /* light sweep */
        .status-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);
            transition: 0.5s;
        }

        .status-btn:hover::before {
            left: 100%;
        }

        /* ===== SPINNER ===== */
        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <h1>AttendX / Edit Attendance</h1>

        <div class="card">
            <p><strong>Course:</strong> <span id="subject"></span></p>
            <p><strong>Department:</strong> <span id="department"></span></p>
            <p><strong>Program:</strong> <span id="program"></span></p>
            <p><strong>Semester:</strong> <span id="sem"></span></p>
            <p><strong>Section:</strong> <span id="section"></span></p>
        </div>

        <div class="attendance-controls">

            <div>
                <label>📅 Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div>
                <label>⏰ Class Time</label>
                <select id="timeSelect">
                    <option value="">Select date first</option>
                </select>
            </div> <br>

            <div style="display:flex; align-items:flex-end; margin-left:auto;">
                <button class="btn load-btn" onclick="loadAttendance(event)">
                    Load
                </button>
            </div>

        </div>

        <div class="bulk-actions">
            <button class="btn" onclick="markAll(true, event)">Mark All Present</button>
            <button class="btn" onclick="markAll(false, event)">Mark All Absent</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>USN</th>
                        <th>Name</th>
                        <th>%</th>
                        <th>Status</th>
                        <th>Reason</th>
                    </tr>
                </thead>
                <tbody id="studentRows"></tbody>
            </table>
        </div>

    </div>

    <script src="/static/edit.js"></script>

</body>

</html>
