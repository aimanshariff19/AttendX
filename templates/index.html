<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX Faculty Login</title>

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- ADD THIS INSIDE <head> (below your CSS link) -->
    <style>
        /* SPINNER */
        .btn-loading {
            display: none;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 500;
        }

        /* SPINNER */
        .btn-loader {
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top: 2px solid #38bdf8;
            /* 🔥 visible color */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* BUTTON FLEX */
        #loginBtn {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SHAKE */
        .shake {
            animation: shake 0.3s;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            50% {
                transform: translateX(6px);
            }

            75% {
                transform: translateX(-6px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>

</head>

<body class="login-page faculty">

    <div class="login-container">

        <!-- LOGO -->
        <img src="/static/assets/logo.png" class="college-logo" alt="Atria Logo">

        <!-- COLLEGE INFO -->
        <div class="college-info">
            <h2 class="college-name">Atria Institute of Technology</h2>
            <p class="college-location">Hebbal, Bengaluru</p>
            <p class="college-status">(Autonomous Institution)</p>
        </div>

        <!-- TITLE -->
        <h3 class="system-title">AttendX Faculty Portal</h3>

        <form id="loginForm" autocomplete="on" action="/api/login/faculty" method="POST">

            <div class="input-group">
                <label for="username">Faculty ID</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="input-group password-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <i id="eyeIcon" class="fa-solid fa-eye eye" onclick="togglePassword()"></i>
            </div>

            <div class="form-extra">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button id="loginBtn" type="submit">
                <span class="btn-text">Login</span>
                <span class="btn-loading" style="display:none;">
                    Logging in...
                    <span class="btn-loader"></span>
                </span>
            </button>

        </form>

        <p id="error" class="error-text"></p>

    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {

            const form = document.getElementById("loginForm");
            const btn = document.getElementById("loginBtn");
            const container = document.querySelector(".login-container");
            const errorText = document.getElementById("error");

            const normalText = btn.querySelector(".btn-text");
            const loadingText = btn.querySelector(".btn-loading");

            /* 🔥 FIXED SUBMIT */
            form.addEventListener("submit", function (e) {
                e.preventDefault(); // 🔥 STOP instant reload

                normalText.style.display = "none";
                loadingText.style.display = "inline-flex";

                btn.disabled = true;

                // 🔥 FORCE UI RENDER THEN SUBMIT
                setTimeout(() => {
                    form.submit();
                }, 150); // little delay so spinner shows properly
            });

            /* ERROR HANDLING */
            const params = new URLSearchParams(window.location.search);

            if (params.get("error") === "invalid") {
                errorText.innerText = "Invalid Credentials";

                container.classList.add("shake");

                setTimeout(() => {
                    container.classList.remove("shake");
                }, 300);
            }

        });
    </script>

</body>

</html>
