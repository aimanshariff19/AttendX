<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX / HOD Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #5f5cff55;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed55;
            bottom: -100px;
            right: -100px;
        }

        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow:
                0 0 10px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(139, 92, 246, 0.15);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .logout-btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(95, 92, 255, 0.5);
        }

        .faculty-panel h2 {
            font-size: 22px;
        }

        .faculty-panel p {
            color: #9ca3af;
            font-size: 13px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .course-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            transition: 0.25s;
        }

        .course-card:hover {
            transform: translateY(-4px);
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .filter-bar select {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(15, 23, 42, 0.8);
            color: #e5e7eb;
            font-size: 13px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, 240px);
            gap: 18px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 14px;
            min-height: 170px;
            display: flex;
            flex-direction: column;
        }

        .subject-card p {
            font-size: 13px;
            color: #9ca3af;
        }

        .subject-card button {
            margin-top: auto;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>AttendX / HOD Dashboard</h1>

        <button class="logout-btn" onclick="logout()">Logout</button>

        <div class="faculty-panel">
            <h2 id="hodName">Loading...</h2>
            <p id="hodDept">Loading Department...</p>
        </div>

        <div class="cards">
            <div class="course-card">
                <h3 id="totalCourses">0</h3>
                <p>Courses</p>
            </div>
            <div class="course-card">
                <h3 id="totalSections">0</h3>
                <p>Sections</p>
            </div>
            <div class="course-card">
                <h3 id="totalStudents">0</h3>
                <p>Students</p>
            </div>
            <div class="course-card">
                <h3 id="totalFaculty">0</h3>
                <p>Faculty</p>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filter-bar">
            <select id="filterDept"></select>
            <select id="filterProgram"></select>
            <select id="filterSem"></select>
            <select id="filterSection"></select>
            <button onclick="applyFilters()">Apply</button>
        </div>

        <!-- SUBJECT CARDS ONLY -->
        <div class="subjects" id="courseCards"></div>

    </div>

    <script>
        const hodName = {{ hod_name | tojson | safe }};
        const deptName = {{ dept_name | tojson | safe }};
        const stats = {{ stats | tojson | safe }};
    </script>

    <script src="/static/hod.js"></script>

</body>

</html>
