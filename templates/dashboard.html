<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX Faculty Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #5f5cff55;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed55;
            bottom: -100px;
            right: -100px;
        }

        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.6s ease;
        }

        h1 {
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 600;
            background: linear-gradient(90deg, #c7d2fe, #a78bfa, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow:
                0 0 10px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(139, 92, 246, 0.15);
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        @keyframes titleGlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* ===== LOGOUT ===== */
        .logout-btn {
            padding: 8px 16px;
            /* reduced */
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            /* adjusted */
            width: fit-content;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(95, 92, 255, 0.5);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .course-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }

        .course-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 220px));
            gap: 16px;
            justify-content: flex-start;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }

        .subject-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        button {
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            cursor: pointer;
            width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== LOADING ===== */
        button.loading {
            pointer-events: none;
            opacity: 0.9;
        }

        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>AttendX / Faculty Dashboard</h1>

        <button class="logout-btn" onclick="logout(this)">
            Logout
        </button>

        <div class="faculty-panel">
            <h2 id="facultyName">Loading...</h2>
            <p id="facultyDept">Loading...</p>
        </div>

        <div class="cards">
            <div class="course-card">
                <h3 id="courseCount">0</h3>
                <p>Courses</p>
            </div>
            <div class="course-card">
                <h3 id="sectionCount">0</h3>
                <p>Sections</p>
            </div>
            <div class="course-card">
                <h3 id="studentCount">0</h3>
                <p>Students</p>
            </div>
            <div class="course-card">
                <h3 id="facultyId">-</h3>
                <p>Faculty ID</p>
            </div>
        </div>

        <div class="card">
            <h3>Today's Schedule</h3>
            <div id="todaySchedule">Loading...</div>
        </div>

        <h3>Your Courses</h3>

        <div class="subjects" id="courseCards"></div>

    </div>

    <!-- ✅ FIXED SCRIPT (NO ERROR NOW) -->
    <script>
        const faculty = JSON.parse('{{ faculty | tojson | safe }}');
        const rawSubjects = JSON.parse('{{ subjects | tojson | safe }}');
        const sectionCount = JSON.parse('{{ section_count | tojson | safe }}');
        const studentCount = JSON.parse('{{ student_count | tojson | safe }}');

        console.log("Faculty:", faculty);
        console.log("Subjects:", rawSubjects);
    </script>

    <script src="/static/dashboard.js"></script>

</body>

</html>
