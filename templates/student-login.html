<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX Student Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-page student">

    <div class="login-container">

        <!-- Logo -->
        <img src="/static/assets/logo.png" class="college-logo">

        <!-- college info -->
        <div class="college-info">
            <h2 class="college-name">Atria Institute of Technology</h2>
            <p class="college-location">Hebbal, Bengaluru</p>
            <p class="college-status">(Autonomous Institution)</p>
        </div>

        <h3 class="system-title">AttendX Student Portal</h3>

        <!-- FORM -->
        <form id="studentForm" action="/api/login/student" method="POST">

    <div class="input-group">
        <label>Student ID</label>
        <input type="text" id="username" name="username" placeholder=" " required>
    </div>

    <div class="input-group password-field">
        <label>Password</label>
        <input type="password" id="password" name="password" placeholder=" " required>
        <i id="eyeIcon" class="fa-solid fa-eye eye"></i>
    </div>

    <button id="loginBtn" type="submit">
        <span class="btn-text">Login</span>
        <span class="btn-loader"></span>
    </button>
</form>

        <p id="error" class="error-text"></p>

    </div>

    <!-- 🔥 IMPORTANT ORDER -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/static/utils.js"></script>
    <script src="/static/student-login.js"></script>

</body>

</html>
