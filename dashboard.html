<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX Faculty Dashboard</title>

    <style>
        /* ===== BODY ===== */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        /* ===== GLOW ===== */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            z-index: 0;
        }

        body::before {
            background: #5f5cff55;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed55;
            bottom: -100px;
            right: -100px;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.6s ease;
        }

        /* ===== HEADER ===== */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-actions h1 {
            font-size: 22px;
            font-weight: 600;
        }

        /* ===== LOGOUT ===== */
        .logout-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            cursor: pointer;
        }

        /* ===== PROFILE ===== */
        .faculty-panel h2 {
            font-size: 26px;
        }

        .dept {
            color: #aaa;
        }

        /* ===== BUTTON ===== */
        button {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5f5cff, #7c3aed);
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔥 LOADING */
        button.loading {
            pointer-events: none;
            opacity: 0.9;
        }

        /* 🔥 FORCE SPINNER */
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header-actions">
            <h1>AttendX / Faculty Dashboard</h1>

            <!-- ✅ FIXED STRUCTURE -->
            <button class="logout-btn" onclick="logout(this)">
                <span>Logout</span>
            </button>
        </div>

        <div class="faculty-panel">
            <h2 id="facultyName">Dr. Kumar</h2>
            <p id="facultyDept" class="dept">Department: CSE</p>
        </div>

        <h3 style="margin-bottom:10px;">Your Courses</h3>

        <div class="subjects" id="courseCards">
            <div class="subject-card">
                <h4>Data Structures</h4>
                <p>CSE • Sem 3 • Sec A</p>

                <!-- ✅ FIXED STRUCTURE -->
                <button onclick="openCourse('DS','CSE',3,'A', this)">
                    <span>Take Attendance</span>
                </button>
            </div>
        </div>

    </div>

    <script src="mockData.js"></script>
    <script src="utils.js"></script>
    <script src="dashboard.js"></script>

</body>

</html>
